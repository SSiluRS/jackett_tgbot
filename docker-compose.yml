version: "3.8"

services:
  xray:
    image: teddysun/xray:latest
    container_name: xray-vless
    restart: unless-stopped
    volumes:
      - ./xray-config:/etc/xray
    networks:
      - vpn_net

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    environment:
      - PUID=1031
      - PGID=100
      - TZ=Europe/Moscow
    volumes:
      - ./jackett-config:/config
      - ./torrent-watch:/downloads
    ports:
      - "9117:9117"
    depends_on:
      - xray
    networks:
      - vpn_net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/Moscow
      - REQ_PROXY=http://xray:10809
    volumes:
      - ./flaresolver:/config
    ports:
      - "8191:8191"
    restart: unless-stopped
    depends_on:
      - xray
    networks:
      - vpn_net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1031
      - PGID=100
      - TZ=Europe/Moscow
      - WEBUI_PORT=8083
    volumes:
      - ./qbittorrent-config:/config
      # Укажите путь к вашей папке для скачивания торрентов на Synology:
      - /volume1/docker/lampa/dlna/data:/downloads 
      - ./torrent-watch:/watch 
    ports:
      - "8083:8083" # Порт для входа в веб-интерфейс qBittorrent
      - "6881:6881" # Порты для закачки (TCP)
      - "6881:6881/udp" # Порты для закачки (UDP)
    networks:
      - vpn_net

  jackett_tgbot:
    image: ghcr.io/ssilurs/jackett_tgbot:latest
    # Раскомментируйте build, если собираете образ локально, а не качаете с GHCR:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: jackett_tgbot
    restart: always
    environment:
      - TG_TOKEN=${TG_TOKEN}
      - USERS=${USERS} # Telegram ID пользователей через запятую
      
      # Подключение к Jackett в контейнерной сети
      - JACKETT_URL=http://jackett:9117
      - JACKETT_API=${JACKETT_API}
      
      # Переменные для qBittorrent API (мониторинг закачек)
      - QBITTORRENT_URL=http://qbittorrent:8083
      - QBITTORRENT_USER=${QBITTORRENT_USER:-admin}
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-adminadmin}
      
      # Заворачиваем весь трафик бота в VLESS прокси (для обхода блокировок Telegram)
      - HTTP_PROXY=http://xray:10809
      - HTTPS_PROXY=http://xray:10809
    volumes:
      # Папка автозагрузки, которую слушает qBittorrent
      - ./torrent-watch:/watch
    networks:
      - vpn_net
    depends_on:
      - jackett
      - xray    

networks:
  vpn_net:
    driver: bridge
